name: Internal server container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify durable scheduling and standalone server behavior
        run: node --test --test-isolation=none tests/calculation-pool.test.js tests/standalone-scheduler.test.js tests/deployment-server.test.js tests/deployment-database.test.js
      - name: Build the internal-server image
        run: docker compose build --pull
      - name: Verify calculation and PI connector contracts in the packaged image
        run: docker compose run --rm --no-deps -v "${PWD}/tests:/app/tests:ro" app node --test --test-isolation=none tests/calculation-pool.test.js tests/results-export.test.js tests/pi-connectors.test.js tests/pi-api.test.js tests/pi-config.test.js tests/pi-configuration.test.js
      - name: Exercise login, unattended reconciliation, restart safety, and persistent storage
        run: node scripts/docker-smoke.mjs
