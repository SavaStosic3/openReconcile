name: Internal server container

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/**'
      - 'backend/**'
      - 'public/**'
      - 'drizzle/**'
      - 'package.json'
      - 'scripts/docker-smoke.mjs'
      - 'tests/standalone-scheduler.test.js'
      - 'tests/deployment-server.test.js'
      - 'tests/deployment-database.test.js'
      - 'tests/pi-*.test.js'
      - 'tests/helpers/pi-fixture.js'
      - 'docs/self-hosting.md'
      - 'docs/pi-web-api.md'
      - 'README.md'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'deploy/**'
      - 'backend/**'
      - 'public/**'
      - 'drizzle/**'
      - 'package.json'
      - 'scripts/docker-smoke.mjs'
      - 'tests/standalone-scheduler.test.js'
      - 'tests/deployment-server.test.js'
      - 'tests/deployment-database.test.js'
      - 'tests/pi-*.test.js'
      - 'tests/helpers/pi-fixture.js'
      - 'docs/self-hosting.md'
      - 'docs/pi-web-api.md'
      - 'README.md'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify durable scheduling and standalone server behavior
        run: node --test --test-isolation=none tests/standalone-scheduler.test.js tests/deployment-server.test.js tests/deployment-database.test.js
      - name: Build the internal-server image
        run: docker compose build --pull
      - name: Verify PI connector contracts in the packaged image
        run: docker compose run --rm --no-deps -v "${PWD}/tests:/app/tests:ro" app node --test --test-isolation=none tests/pi-connectors.test.js tests/pi-api.test.js tests/pi-config.test.js
      - name: Exercise login, unattended reconciliation, restart safety, and persistent storage
        run: node scripts/docker-smoke.mjs
