name: openreconcile

services:
  app:
    image: ${OPENRECONCILE_IMAGE:-openreconcile:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      AUTH_MODE: password
      HOST: 0.0.0.0
      PORT: "8080"
      APP_DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-100}
      SQL_GATEWAY_URL: ${SQL_GATEWAY_URL:-}
      SQL_GATEWAY_TOKEN: ${SQL_GATEWAY_TOKEN:-}
    volumes:
      - data:/data
    stop_grace_period: 30s

volumes:
  data:
    name: ${OPENRECONCILE_DATA_VOLUME:-openreconcile_data}
